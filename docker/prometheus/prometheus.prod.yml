global:
  scrape_interval: 15s

scrape_configs:
  - job_name: overlab-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9091"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: backup
    metrics_path: /metrics.prom
    static_configs:
      - targets: ["backup:9100"]
