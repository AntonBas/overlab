apiVersion: 1

contactPoints:
  - orgId: 1
    name: overlab-alerts
    receivers:
      - uid: overlab-telegram
        type: telegram
        settings:
          bottoken: "$TELEGRAM_BOT_TOKEN"
          chatid: "__TELEGRAM_CHAT_ID__"
          message: '{{ template "overlab.message" . }}'
      - uid: overlab-email
        type: email
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: true

deleteContactPoints:
  - orgId: 1
    uid: ""
    name: email receiver
