apiVersion: 1

groups:
  - orgId: 1
    name: overlab-collector
    folder: Overlab
    interval: 5m
    rules:
      - uid: collector-daily-stale
        title: "Collector: no successful daily-overview run for 2 days"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - collector_last_success_timestamp_seconds{collector_job="daily-overview"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 172800
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The daily-overview job has not finished successfully for longer than expected. Check Collector runs in the admin API and the backend logs."
      - uid: collector-weekly-stale
        title: "Collector: no successful weekly-maps run for 9 days"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - collector_last_success_timestamp_seconds{collector_job="weekly-maps"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 777600
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The weekly-maps job has not finished successfully for longer than expected. Check Collector runs in the admin API and the backend logs."
