apiVersion: 1

groups:
  - orgId: 1
    name: overlab-collector
    folder: Overlab
    interval: 5m
    rules:
      - uid: collector-daily-stale
        title: "Колектор: щоденний збір не відпрацьовував понад 2 дні"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - collector_last_success_timestamp_seconds{collector_job="daily-overview"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 172800
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Щоденний збір статистики не відпрацював понад 2 дні. Що робити: відкрий адмінку, розділ Collector, і подивись помилку в історії запусків."
      - uid: collector-weekly-stale
        title: "Колектор: тижневий збір по картах не відпрацьовував понад 9 днів"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - collector_last_success_timestamp_seconds{collector_job="weekly-maps"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 777600
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Тижневий збір статистики по картах не відпрацював понад 9 днів. Що робити: відкрий адмінку, розділ Collector, і подивись помилку в історії запусків."
      - uid: collector-rejected-snapshots
        title: "Колектор: Blizzard віддав дані, які не пройшли перевірку"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(collector_rejected_snapshots_total[1d]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "За останню добу Blizzard віддав дані, які не пройшли перевірку. Зазвичай це означає, що Blizzard змінив формат. Що робити: подивись попередження колектора в логах бекенду."
      - uid: collector-new-hero
        title: "Колектор: з'явився новий герой"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(collector_new_heroes_total[6h]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "У статистиці Blizzard з'явився герой, якого ще немає на сайті. Що робити: в адмінці додай опис, сильні й слабкі сторони, категорії, контри та синергії."
      - uid: collector-new-map
        title: "Колектор: з'явилась нова карта"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(collector_new_maps_total[6h]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "У статистиці з'явилась нова карта. Що робити: в адмінці вкажи її режим і зображення."
      - uid: collector-role-changed
        title: "Колектор: герой змінив роль"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(collector_role_changes_total[6h]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Blizzard перевів героя в іншу роль. Що робити: перевір його сильні й слабкі сторони, категорії, контри та синергії. Минула статистика тепер показується з новою роллю."
