name: overlab

services:
  edge:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    container_name: overlab-edge
    restart: unless-stopped
    environment:
      SITE_ADDRESS: http://localhost
    ports:
      - "${APP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - overlab-net

  backend:
    build:
      context: ./backend
    container_name: overlab-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-overlab}
      DB_USER: ${DB_USER:-overlab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@overlab.gg}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COLLECTOR_GAME_FORMAT: ${COLLECTOR_GAME_FORMAT:-FIVE_VS_FIVE}
      COLLECTOR_DOWNLOAD_PORTRAITS: ${COLLECTOR_DOWNLOAD_PORTRAITS:-false}
      COLLECTOR_IMPORT_PERKS: ${COLLECTOR_IMPORT_PERKS:-false}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - overlab-net

  postgres:
    image: postgres:16-alpine
    container_name: overlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-overlab}
      POSTGRES_USER: ${DB_USER:-overlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${TZ:-Europe/Kyiv}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-overlab} -d ${DB_NAME:-overlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - overlab-net

  redis:
    image: redis:7-alpine
    container_name: overlab-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - overlab-net

  mailpit:
    image: axllent/mailpit:v1.32
    container_name: overlab-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - overlab-net

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: overlab-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks:
      - overlab-net

  grafana:
    image: grafana/grafana:11.6.16
    container_name: overlab-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - overlab-net

networks:
  overlab-net:
    driver: bridge

volumes:
  media:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
