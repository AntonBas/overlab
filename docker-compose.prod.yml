services:
  edge:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        VITE_SITE_URL: ${FRONTEND_URL:?Set FRONTEND_URL, for example https://overlabgg.com}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        VITE_CONTROLLER_NAME: ${CONTROLLER_NAME:-}
        VITE_CONTROLLER_ADDRESS: ${CONTROLLER_ADDRESS:-}
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS, for example overlabgg.com}
      WWW_ADDRESS: www.${SITE_ADDRESS}
      CANONICAL_URL: ${FRONTEND_URL:?Set FRONTEND_URL, for example https://overlabgg.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overlab-net

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 400
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_VERSION: ${APP_VERSION:-unknown}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-overlab}
      DB_USER: ${DB_USER:-overlab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL, for example https://overlabgg.com}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COLLECTOR_GAME_FORMAT: ${COLLECTOR_GAME_FORMAT:-FIVE_VS_FIVE}
      COLLECTOR_DOWNLOAD_PORTRAITS: ${COLLECTOR_DOWNLOAD_PORTRAITS:-true}
      COLLECTOR_IMPORT_PERKS: ${COLLECTOR_IMPORT_PERKS:-false}
      COLLECTOR_IMAGE_HOSTS: ${COLLECTOR_IMAGE_HOSTS:-blz-contentstack.com,d15f34w2p8l1cc.cloudfront.net}
      COLLECTOR_STARTUP_JOB: ${COLLECTOR_STARTUP_JOB:-}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging
    networks:
      - overlab-net

  postgres:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-overlab}
      POSTGRES_USER: ${DB_USER:-overlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      TZ: ${TZ:-Europe/Kyiv}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-overlab} -d ${DB_NAME:-overlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - overlab-net

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command:
      - sh
      - -c
      - printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf && exec redis-server /tmp/redis-auth.conf --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - overlab-net

  backup:
    build:
      context: ./docker/backup
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-overlab}
      DB_USER: ${DB_USER:-overlab}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_VERIFY_INTERVAL_DAYS: ${BACKUP_VERIFY_INTERVAL_DAYS:-7}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-7}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-4}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-6}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - media:/media:ro
      - ${RCLONE_CONFIG_DIR:-./docker/backup/rclone}:/config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    logging: *logging
    networks:
      - overlab-net

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.disable-defaults", "--collector.filesystem"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    volumes:
      - /:/host:ro
    logging: *logging
    networks:
      - overlab-net

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    networks:
      - overlab-net

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - rm -rf /tmp/provisioning && cp -R /etc/grafana/provisioning-source /tmp/provisioning && sed -i "s|__TELEGRAM_CHAT_ID__|$$TELEGRAM_CHAT_ID|" /tmp/provisioning/alerting/contact-points.yml && exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /tmp/provisioning
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${MAIL_HOST}:${MAIL_PORT:-587}
      GF_SMTP_USER: ${MAIL_USERNAME:-}
      GF_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${EMAIL_FROM}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN for alert notifications}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID for alert notifications}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Set ALERT_EMAIL_TO for alert notifications}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning-source:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus
    logging: *logging
    networks:
      - overlab-net

networks:
  overlab-net:
    driver: bridge

volumes:
  media:
  pgdata:
  caddydata:
  caddyconfig:
  prometheusdata:
  grafanadata:
