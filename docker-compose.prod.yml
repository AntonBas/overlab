services:
  edge:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS, for example overlabgg.com}
      WWW_ADDRESS: www.${SITE_ADDRESS}
      CANONICAL_URL: ${FRONTEND_URL:?Set FRONTEND_URL, for example https://overlabgg.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overlab-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-overlab}
      DB_USER: ${DB_USER:-overlab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL, for example https://overlabgg.com}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COLLECTOR_GAME_FORMAT: ${COLLECTOR_GAME_FORMAT:-FIVE_VS_FIVE}
      COLLECTOR_DOWNLOAD_PORTRAITS: ${COLLECTOR_DOWNLOAD_PORTRAITS:-true}
      COLLECTOR_IMPORT_PERKS: ${COLLECTOR_IMPORT_PERKS:-false}
      COLLECTOR_IMAGE_HOSTS: ${COLLECTOR_IMAGE_HOSTS:-blz-contentstack.com,d15f34w2p8l1cc.cloudfront.net}
      COLLECTOR_STARTUP_JOB: ${COLLECTOR_STARTUP_JOB:-}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging
    networks:
      - overlab-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-overlab}
      POSTGRES_USER: ${DB_USER:-overlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-overlab} -d ${DB_NAME:-overlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - overlab-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - overlab-net

  backup:
    build:
      context: ./docker/backup
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-overlab}
      DB_USER: ${DB_USER:-overlab}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-30}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - media:/media:ro
      - ${RCLONE_CONFIG_DIR:-./docker/backup/rclone}:/config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    logging: *logging
    networks:
      - overlab-net

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    logging: *logging
    networks:
      - overlab-net

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    logging: *logging
    networks:
      - overlab-net

networks:
  overlab-net:
    driver: bridge

volumes:
  media:
  pgdata:
  caddydata:
  caddyconfig:
  prometheusdata:
  grafanadata:
