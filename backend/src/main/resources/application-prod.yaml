management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    gg.overlab: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
