spring:
  application:
    name: overlab-backend
  profiles:
    default: local
  config:
    import: classpath:collector.yaml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 1s
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "overlab:"
      use-key-prefix: true

app:
  frontend-url: ${FRONTEND_URL}
  contact-email: ${CONTACT_EMAIL:}
  media:
    directory: ${MEDIA_DIRECTORY:./media}
    base-url: ${MEDIA_BASE_URL:/media}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 5m
    refresh-token-ttl: 14d
    verification-token-ttl: 24h
    reset-token-ttl: 1h
    cookie-secure: true
    mail-from: ${EMAIL_FROM:noreply@overlabgg.com}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    rate-limit-per-minute: 10

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  environment: ${SPRING_PROFILES_ACTIVE:local}
  exception-resolver-order: 2147483647

management:
  endpoints:
    web:
      exposure:
        include: health
  info:
    env:
      enabled: true
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
    tags:
      application: ${spring.application.name}

info:
  app:
    version: ${APP_VERSION:unknown}

server:
  port: ${BACKEND_HOST_PORT:8080}
  shutdown: graceful
