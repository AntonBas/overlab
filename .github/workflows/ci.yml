name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          load: true
          tags: overlab-backend:ci
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max
      - name: Build edge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/caddy/Dockerfile
          load: true
          tags: overlab-edge:ci
          cache-from: type=gha,scope=edge-image
          cache-to: type=gha,scope=edge-image,mode=max
      - name: Check the production compose file and the edge configuration
        env:
          SITE_ADDRESS: example.test
          FRONTEND_URL: https://example.test
          DB_PASSWORD: ci
          REDIS_PASSWORD: ci
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          MAIL_HOST: mail.example.test
          EMAIL_FROM: noreply@example.test
          GRAFANA_ADMIN_PASSWORD: ci
          TELEGRAM_BOT_TOKEN: "1:ci"
          TELEGRAM_CHAT_ID: "-1"
          ALERT_EMAIL_TO: ops@example.test
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker run --rm -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" overlab-edge:ci caddy validate --config /etc/caddy/Caddyfile
      - name: Scan the images for critical vulnerabilities
        run: |
          for image in overlab-backend:ci overlab-edge:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --quiet "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 --quiet "$image"
          done

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Start the application stack with an empty database
        env:
          DB_PASSWORD: ci
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          GRAFANA_ADMIN_PASSWORD: ci
        run: docker compose up -d --build --wait postgres redis backend edge
      - name: Audit the pages that do not need collected statistics
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.preview.json
      - name: Show the stack logs when the audit fails
        if: failure()
        env:
          DB_PASSWORD: ci
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          GRAFANA_ADMIN_PASSWORD: ci
        run: docker compose logs --tail 100 backend edge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-preview-report
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14

  dependabot-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend, docker]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Require a green Security run for the same commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            result="$(gh run list --repo "$REPOSITORY" --workflow Security --commit "$HEAD_SHA" --limit 20 --json status,conclusion --jq '[.[] | .status + " " + (.conclusion // "")] | join(",")' || true)"
            case "$result" in
              *"completed success"*)
                echo "Security passed"
                exit 0
                ;;
              "" | *queued* | *in_progress* | *waiting* | *pending*)
                echo "Security has not finished yet ($attempt/60)"
                ;;
              *)
                echo "::error::Security did not pass: $result"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::Security did not finish in time"
          exit 1

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
