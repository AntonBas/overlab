name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy
        required: true
        default: main
  push:
    tags: ["v*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Check the deploy settings
        env:
          REF: ${{ github.event.inputs.ref || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::The ref contains unexpected characters"
            exit 1
          fi
          if [ -n "$SHA" ] && ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::The commit id is not valid"
            exit 1
          fi

      - name: Require a green CI and Security run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event.inputs.ref || github.ref_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$EVENT_SHA" ]; then
            sha="$EVENT_SHA"
          else
            sha="$(gh api "repos/$REPOSITORY/commits/$REF" --jq .sha)"
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve $REF to a commit"
            exit 1
          fi
          echo "VERIFIED_SHA=$sha" >> "$GITHUB_ENV"
          for workflow in CI Security; do
            for attempt in $(seq 1 60); do
              result="$(gh run list --repo "$REPOSITORY" --workflow "$workflow" --commit "$sha" --limit 20 --json status,conclusion --jq '[.[] | .status + " " + (.conclusion // "")] | join(",")' || true)"
              case "$result" in
                *"completed success"*)
                  echo "$workflow passed"
                  break
                  ;;
                "" | *queued* | *in_progress* | *waiting* | *pending*)
                  echo "$workflow has not finished yet ($attempt/60)"
                  ;;
                *)
                  echo "::error::$workflow did not pass: $result"
                  exit 1
                  ;;
              esac
              if [ "$attempt" = "60" ]; then
                echo "::error::$workflow did not finish in time"
                exit 1
              fi
              sleep 20
            done
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Update the server
        env:
          REF: ${{ github.event.inputs.ref || github.ref_name }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "$REF $VERIFIED_SHA"

      - name: Wait for the site
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "$DEPLOY_URL/sitemap.xml"; then
              echo "The site answered on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site did not answer after the deploy"
          exit 1
